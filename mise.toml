# docs https://mise.jdx.dev/

[tools]
node = "26.13"
pnpm = "latest"
poetry = "2.5"
python = "3.15"

[env]
# dirs
ROOT_DIR = "{{config_root}}"
SCANNER_DIR = "{{env.ROOT_DIR}}/scanner/CS_CityScoPy-3.2"
APP_DIR = "{{env.ROOT_DIR}}/windpark-app"
API_DIR = "{{env.APP_DIR}}/server"

# pnpm
PNPM_CONFIG_MINIMUM_RELEASE_AGE = 2880

[shell_alias]
ll = "ls -la"
npm = "pnpm"
run = "mise run"

[tasks.calibrate]
description = "calibrate the scanner camera"
dir = "{{env.SCANNER_DIR}}"
run = "poetry run python calibrate.py"

[tasks.scanner]
description = "run the scanner"
dir = "{{env.SCANNER_DIR}}"
run = "poetry run python run.py"

[tasks.server]
description = "run the api backend for the app"
dir = "{{env.API_DIR}}"
run = "pnpm run start"

[tasks.frontend]
description = "run the frontend"
dir = "{{env.APP_DIR}}"
run = "http-server -c-1"
